name: Android APK
on:
  push:
    branches: [main]
    paths: ['android-src.txt', '.github/workflows/android.yml', 'voice.js', 'icon-192.png']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gyul-debug-keystore-v1
      - name: Unpack Android source
        run: |
          python3 - <<'PY'
          import os
          cur=None; buf=[]
          def flush():
              if cur:
                  os.makedirs(os.path.dirname(cur), exist_ok=True)
                  open(cur,'w',encoding='utf-8').write(''.join(buf))
          for line in open('android-src.txt',encoding='utf-8'):
              if line.startswith('@@@FILE '):
                  flush(); cur=line[8:].strip(); buf=[]
              else:
                  buf.append(line)
          flush()
          PY
          find android -type f
      - name: Prepare voices and icon
        run: python3 android/prep.py
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk gyul-yak.apk
      - name: Build Play Store bundle (AAB) when upload key is set
        id: aab
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KS_B64" ]; then echo "업로드 키가 아직 없어서 AAB는 건너뜀"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" gradle bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../gyul-yak.aab
          echo "made=1" >> "$GITHUB_OUTPUT"
      - name: Upload AAB (private, for Play Console)
        if: steps.aab.outputs.made == '1'
        uses: actions/upload-artifact@v4
        with:
          name: gyul-yak-aab
          path: gyul-yak.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 귤손녀 약 알림 앱 (시험판)
          body: 휴대폰에서 아래 gyul-yak.apk를 눌러 설치하세요.
          files: gyul-yak.apk
          make_latest: true
